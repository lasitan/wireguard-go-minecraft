# Example: edit configs under ./config then:
#   docker compose up -d
#
# Image: set LASITAN_IMAGE or build locally with deploy/scripts/package-docker.sh
services:
  lasitan-cluster:
    image: ${LASITAN_IMAGE:-ghcr.io/lasitan/Lasitan-Cluster:latest}
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile
      args:
        GO_VERSION: ${GO_VERSION:-1.23.1}
    container_name: lasitan-cluster
    restart: unless-stopped
    network_mode: host
    cap_add:
      - NET_ADMIN
      - NET_RAW
    devices:
      - /dev/net/tun:/dev/net/tun
    volumes:
      - ./config:/etc/lasitan-cluster
    environment:
      LOG_LEVEL: ${LOG_LEVEL:-error}
    # Needed when using ToNAT / Nat gateway (B-side)
    sysctls:
      net.ipv4.ip_forward: "1"
    # If not using network_mode: host, publish ListenPort instead, e.g.:
    # ports:
    #   - "25565:25565"
