# Example: edit configs under ./config then:
#   docker compose up -d
#
# Image: set WG_MC_IMAGE or build locally with scripts/package-docker.sh
services:
  wireguard:
    image: ${WG_MC_IMAGE:-ghcr.io/lasitan/wireguard-go-minecraft:latest}
    build:
      context: .
      args:
        VERSION: ${WG_MC_VERSION:-dev}
        GO_VERSION: ${GO_VERSION:-1.23.1}
    container_name: wireguard-mc
    restart: unless-stopped
    network_mode: host
    cap_add:
      - NET_ADMIN
      - NET_RAW
    devices:
      - /dev/net/tun:/dev/net/tun
    volumes:
      - ./config:/etc/wireguard
    environment:
      LOG_LEVEL: ${LOG_LEVEL:-error}
    # Needed when using ToNAT / Nat gateway (B-side)
    sysctls:
      net.ipv4.ip_forward: "1"
    # If not using network_mode: host, publish ListenPort instead, e.g.:
    # ports:
    #   - "25565:25565"
